- tool: hasMatchingAccessGrant
  reason: >-
    Backed by the Access Grant Service query endpoint (POST /query on vc.{ess-domain}); no published
    OpenAPI operationId.
- tool: getResource
  reason: >-
    Backed by a Solid Protocol GET against the Pod Storage Service. The Solid Protocol is specified by
    the W3C Solid Community Group rather than by an Inrupt OpenAPI, so there is no operationId.
