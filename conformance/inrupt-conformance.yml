generated: '2026-08-23'
method: searched
source: >-
  https://docs.inrupt.com/ess/services/appendix/discovery-endpoint,
  https://login.inrupt.com/.well-known/openid-configuration,
  https://vc.inrupt.com/.well-known/vc-configuration,
  https://notification.inrupt.com/openapi.yaml,
  https://docs.inrupt.com/ess/services/service-notification/notification-delivery-service,
  https://docs.inrupt.com/security/authorization/acp,
  https://www.inrupt.com/blog/inrupt-earns-iso-27001-2022-certification-for-solid-services,
