identifiers:
  introduced: ESS 3.0
  docs: https://docs.inrupt.com/ess/services/identifiers
  forms:
  - form: '{storage-id}/sc/{resource-id}'
    name: canonical URI
    note: >-
      Permanent and globally unique. REQUIRED when issuing Access Grants and when creating notification
      subscriptions, so that access survives a deployment domain change.
  - form: '{storage-id}/sp/{resource-path}'
    name: path URI
    note: Human-meaningful path addressing; may change if the resource is moved.
content_negotiation:
  rdf_serializations: [text/turtle, application/ld+json]
  binary: any content type (Pods store files as well as RDF)
  note: >-
    /.well-known/solid is served as text/turtle; /.well-known/vc-configuration as application/ld+json.
reversibility:
  applicable: true
  grade: verified
  summary: >-
    Inrupt's write surface is unusually reversible because consent, not data, is the primary object:
    an Access Grant can be revoked at any time by the issuer and takes effect immediately, and grants
    additionally carry an expiry so access reverses itself even if nobody acts. Resource deletion,
    however, is NOT reversible and Inrupt says so plainly.
  operations:
  - action: Grant access to a resource
    reversal: Revoke the Access Grant
    window: >-
      Any time before expiry, with no time limit on the revocation itself. Revocation is recorded on
      the Access Grant Service status endpoint (https://vc.{ess-domain}/status) and ESS checks grant
      status server-side on every access as of ESS 3.0, so a revoked grant stops working on the next
      request rather than at the next token refresh.
    docs: https://docs.inrupt.com/ess/services/service-access-grant/service-access-grant-status
    signal: >-
      Subscribers receive an AccessGrantRevoked notification; an expiring grant produces
      AccessGrantExpired.
  - action: Request access to a resource
    reversal: Cancel the Access Request
    window: While status is pending; a cancelled request reports status "cancelled".
    docs: https://docs.inrupt.com/ess/services/service-mcp/mcp-resource
  - action: Create a notification subscription
    reversal: DELETE /subscriptions/{identifier} (operationId removeSubscription)
    window: Any time while the subscription exists; subscriptions also carry an expiration date-time.
    docs: https://docs.inrupt.com/ess/services/service-notification/notification-delivery-service
  - action: Provision a user account
    reversal: DELETE /admin/provision/{accountId}
    window: >-
      Setup state ONLY. Once PUT /admin/provision/{accountId}/activate has run, ownership has
      transferred to the end user and the deprovision endpoint no longer applies.
    docs: https://docs.inrupt.com/ess/services/service-platform-management/platform-management-api
  - action: Delete a Pod resource
    reversal: none
    window: null
    note: >-
      No undelete, restore or trash window is documented. Deletion is further constrained rather than
      softened: a resource with existing direct Data Views returns 409 Conflict until the views are
      removed first. Pruning of deleted resources is a scheduled administrative process
      (https://docs.inrupt.com/ess/administration/resource-deletions), not a user-facing restore.
  - action: Register a Data View definition
    reversal: DELETE /views/registry/{id}
    window: Any time, subject to registry authorization (ESS Administrators only).
