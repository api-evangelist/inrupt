source: >-
  registry.npmjs.org and search.maven.org registry metadata endpoints, cross-checked against
  https://docs.inrupt.com/sdk/javascript-sdk/installation and https://docs.inrupt.com/sdk/java-sdk/installation
  and the github.com/inrupt organization.
note: >-
  Inrupt ships two first-party SDK families: an npm-published TypeScript/JavaScript family under the
  @inrupt scope, and a Maven Central family under the com.inrupt.client group. The JavaScript family is
  actively released (most recent 2026-06). The Java family's newest published artifact on Maven Central
  is 1.3.1, released 2025-01-14 — roughly nineteen months older than the JavaScript SDK and predating
  ESS 3.0 (2026-05-27), ESS 3.1 and ESS 3.2, so a Java consumer's client library is older than the
  server generation it would be talking to.
