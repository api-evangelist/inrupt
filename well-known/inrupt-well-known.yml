method: probed
source: >-
  Live probes of /.well-known/ paths on every apis.yml baseURL host plus the docs and marketing hosts,
  2026-08-23. Only responses carrying a real, correctly-typed document were saved verbatim.
note: >-
  Inrupt does not serve /.well-known/security.txt, /.well-known/api-catalog or /.well-known/ai-plugin.json
  on any host. It DOES serve three real discovery documents that its own ESS documentation specifies
  (https://docs.inrupt.com/ess/services/appendix/discovery-endpoint): an OpenID Connect discovery
  document on the Solid OIDC provider, a Solid discovery document (RDF/Turtle) on the Pod storage host,
  and a Verifiable-Credential service configuration on the Access Grant host. Pod storage hosts answer
  401 rather than 404 for unknown /.well-known/ paths because every non-public path on a Pod requires
  authorization.
