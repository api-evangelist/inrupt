actions:
- target: $.info
  description: Add contact, licence-free description and documentation context absent from info.
  update:
    description: >-
      The ESS Notification Delivery Service lets an authorized agent subscribe to change events on Pod
      resources and on Access Requests and Grants, and receive them as RFC 9421-signed webhook POSTs at
      a remote HTTPS endpoint. Two scopes exist - /subscriptions for authenticated users (delivery is
      further filtered by the subscriber's own authorization on the resource) and /system/subscriptions
      for allow-listed system managers whose legal basis for processing is contract.
    contact:
      name: Inrupt Service Desk
      url: https://inrupt.atlassian.net/servicedesk
    x-documentation: https://docs.inrupt.com/ess/services/service-notification/notification-delivery-service
