aid: inrupt
name: Inrupt
description: >-
  Inrupt is the enterprise company founded by Sir Tim Berners-Lee and John Bruce to commercialize
  Solid, the open decentralized-data specification he created at MIT. Its flagship product is the
  Enterprise Solid Server (ESS), a Kubernetes-deployed platform of cooperating services that gives
  each person or organization a Pod — a personal data store with fine-grained access control,
  auditing, and W3C Verifiable-Credential-based Access Requests and Grants. ESS ships an Access
  Grant service, an Authorization service using Access Control Policies (ACP), a Pod Storage service
  implementing the Solid Protocol, a Notification Delivery service that pushes signed webhooks to
  remote HTTPS endpoints, a Platform Management service with a token-exchange and admin provisioning
  API, an optional hybrid keyword-plus-semantic Search service, and — since ESS 3.0 — an MCP Resource
  Service exposing consent-mediated tools to AI agents. Inrupt also runs PodSpaces, a hosted
  developer-preview deployment of ESS, and publishes first-party JavaScript and Java client SDKs.
url: https://raw.githubusercontent.com/api-evangelist/inrupt/refs/heads/main/apis.yml
