    Add a servers block. The published document declares no servers[], so a tool cannot resolve a
    request URL from the spec alone. ESS is customer-deployed, so the host is templated, with Inrupt's
    own hosted PodSpaces deployment as the default.
  update:
    servers:
    - url: https://notification.{essDomain}
      description: ESS Notification Delivery Service for a given deployment.
      variables:
        essDomain:
          default: inrupt.com
          description: >-
            The ESS deployment domain. inrupt.com is Inrupt's hosted PodSpaces developer preview.
