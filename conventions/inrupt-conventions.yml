auth_style:
  scheme: Bearer JWT (Solid-OIDC access token or ESS Access Token), DPoP-bound where required
  header: 'Authorization: Bearer <token>  or  Authorization: DPoP <token> with a DPoP: <proof> header'
  token_ttl: ESS Access Token default 5 minutes
  see: authentication/inrupt-authentication.yml
idempotency:
  header: null
  supported: true
  mechanism: http-preconditions
  description: >-
    Inrupt does not implement an Idempotency-Key header. Safe repetition on the Solid storage surface
    is instead enforced with HTTP preconditions, which the client SDK sets for you: a create carries a
    precondition that the resource must not already exist (violating it returns 412 Precondition
    Failed), and an update carries the previous state as a changelog whose old values must still match
    what is in the Pod (violating it returns 409 Conflict). The practical effect for an agent is the
    same guarantee an Idempotency-Key gives - a repeated write cannot silently clobber a concurrent
    one - but it is achieved by optimistic concurrency rather than by request replay, so a retry after
    a network timeout is NOT automatically deduplicated and must be reconciled by re-fetching.
  evidence:
  - >-
    412 Precondition Failed - "saveSolidDatasetAt attempts to create a new Resource at the specified
    URL if the passed-in Resource has no URL identifying it. When creating a new Resource, the function
    adds the precondition that the Resource must not already exist."
    (https://docs.inrupt.com/sdk/javascript-sdk/error-codes)
  - >-
    409 Conflict - "a SolidDataset keeps a changelog that tracks both the old value and new values...
    If the old value specified in the changelog does not correspond to the value currently in the Pod,
    the save operation returns a 409 Conflict error."
  retention: not applicable - no replay cache is maintained
  gap: >-
    On the Notification Delivery Service and Platform Management APIs there is no idempotency mechanism
    at all: POST /subscriptions and POST /admin/provision are not documented as safely repeatable, and
    neither accepts a client-supplied request key.
pagination:
  style: page-number
  params:
  - name: page
    description: Page number; must be a positive integer.
  - name: pageSize
    description: Items per page; positive integer, maximum 100, default 10.
  response_fields:
  - items
  link_headers:
  - 'Link: <next-page-url>; rel="next"  (absent when there is no next page)'
  - 'Link: <prev-page-url>; rel="prev"  (absent on the first page)'
  applies_to:
  - GET /subscriptions
  - GET /system/subscriptions
  - GET /subscriptions/{identifier}/delivery-failures
  note: >-
    The Search Service uses its own request-body paging rather than these query parameters
    (https://docs.inrupt.com/ess/services/service-search/search-api).
field_expansion:
  supported: false
  note: >-
    No expand / fields / include parameters. On the Solid storage surface the equivalent capability is
    Data Views - a Pod owner registers a GraphQL schema and query in /views/registry and binds it to a
    source resource, so a projection of the data is served at its own URL. That is a server-side
    materialized projection, not a per-request sparse-fieldset parameter.
  docs: https://docs.inrupt.com/ess/services/service-pod-management/data-views-api
