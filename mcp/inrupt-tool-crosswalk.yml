source: >-
  mcp/inrupt-mcp.yml (from https://docs.inrupt.com/ess/services/service-mcp/mcp-resource) bound against
  openapi/inrupt-notification-openapi.yaml (https://notification.inrupt.com/openapi.yaml).
summary: >-
  Inrupt's MCP surface and Inrupt's published OpenAPI surface do not overlap at all. The only OpenAPI
  document Inrupt serves describes the Notification Delivery Service (subscriptions and webhooks); the
  MCP Resource Service exposes access-request and resource-read tools whose backing REST services — the
  Access Grant Service (/issue, /query, /status, /verify, /derive) and the Pod Storage Service — are
  documented in prose and RDF discovery documents but publish no OpenAPI. So every MCP tool is
  mcp_only against the available contract, and every OpenAPI operation is rest_only. That is the real
  measurement, not a mapping failure: an agent that reads Inrupt's OpenAPI learns nothing about how to
  request consent, and an agent that uses the MCP tools cannot subscribe to the events that tell it
  when consent arrived.
surfaces:
  openapi:
    file: openapi/inrupt-notification-openapi.yaml
    title: Inrupt Change Notifications
    version: 2.7.1
    served_at: https://notification.inrupt.com/openapi.yaml
    gated: false
    operations: 14
  mcp:
    url: https://mcp.{ess-domain}/api
    gated: true
    gating_note: >-
      Requires an ESS Access Token from token exchange; no public ESS deployment exposes the MCP
      endpoint, so tools/list could not be introspected anonymously.
    tools: 4
  graphql:
    endpoint: null
    note: >-
      ESS has a GraphQL surface only in the sense that Data Views are defined with GraphQL schemas and
      queries registered by the Pod owner (POST /views/registry). There is no provider-operated GraphQL
      endpoint to introspect.
