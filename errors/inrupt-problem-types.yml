source: >-
  openapi/inrupt-notification-openapi.yaml (components.schemas.HttpProblem, HttpValidationProblem,
  Violation, and the per-operation response codes), enriched from
  https://docs.inrupt.com/sdk/javascript-sdk/error-codes and the application/problem+json examples in
